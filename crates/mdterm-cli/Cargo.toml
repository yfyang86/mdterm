[package]
name = "mdterm-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "mdterm binary: PTY-proxy wrapper + markdown render surfaces"

[[bin]]
name = "mdterm-llm"
path = "src/main.rs"

[dependencies]
mdterm-core = { path = "../mdterm-core", version = "0.3.0" }
mdterm-viewer = { path = "../mdterm-viewer", version = "0.3.0" }
# mdterm-pty is implemented on a parallel branch; the path dependency is
# declared so the workspace merges cleanly. `wrap` code is written against
# the spec'd public API (PtyProxy::spawn, HotkeyConfig, ProxyEvent) behind
# a stub until the crate lands.
mdterm-pty = { path = "../mdterm-pty", version = "0.3.0" }
mdterm-render = { path = "../mdterm-render", version = "0.3.0" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["blocking"] }
