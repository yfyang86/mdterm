[package]
name = "mdterm-pty"
version = "0.1.0"
edition = "2021"
description = "Byte-transparent PTY proxy with hotkey interception for mdterm"

# Toolchain: rustc 1.98.1 (see ~/.cargo/bin/rustc). Semver-compatible ranges;
# the lockfile pins exact versions.
[dependencies]
anyhow = "1"
libc = "0.2"
portable-pty = "0.8"
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "sync",
    "signal",
    "macros",
] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
