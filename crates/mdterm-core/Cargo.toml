[package]
name = "mdterm-core"
version = "0.1.0"
edition = "2021"
description = "Transcript model, discovery, watch and parse for mdterm"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
notify = "8"
walkdir = "2"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
